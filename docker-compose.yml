services:
  mongodb:
    image: mongo:6
    container_name: skillgraph-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skillgraph-network

  neo4j:
    image: neo4j:5-community
    container_name: skillgraph-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/skillgraph_password
    volumes:
      - neo4j_data:/data
    networks:
      - skillgraph-network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: skillgraph-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/skillgraph
      - JWT_SECRET=skillgraph_production_jwt_secret_key_2026_devops
      - REFRESH_TOKEN_SECRET=skillgraph_production_refresh_secret_key_2026_devops
      - COOKIE_SECRET=skillgraph_production_cookie_secret_key_2026_devops
      - USE_GRAPH_DB=true
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=skillgraph_password
      - CORS_ORIGIN=http://localhost
    depends_on:
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - skillgraph-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: skillgraph-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - skillgraph-network

networks:
  skillgraph-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
  neo4j_data:
    driver: local
